[project]
name = "airlock"
version = "0.1.0"
description = "Autopilot agent that cleans up wasteful Alibaba Cloud resources behind a human checkpoint the agent structurally cannot bypass."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "fastapi",
    "httpx",
    "mcp",
    "openai",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rfc8785",
    "uvicorn",
]

[project.scripts]
airlock = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "eval"]

[dependency-groups]
dev = [
    "hypothesis",
    "pyright>=1.1.411",
    "pytest",
    "ruff>=0.15.21",
]
